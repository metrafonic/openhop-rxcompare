services:
  rxcompare:
    image: ghcr.io/metrafonic/openhop-rxcompare:latest
    container_name: openhop-rxcompare
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${LISTEN_PORT:-8090}:8080"
    volumes:
      - rxcompare-data:/data   # advert cache (ADVERT_CACHE), so neighbour positions survive restarts
      # More than two systems, or to name radios and pick the default pair? Copy receivers.example.yml
      # to receivers.yml and uncomment. Without it the A_*/B_* vars in .env are used; a multiradio
      # system there still offers each of its radios, and a lone one has them compared to each other.
      #- ./receivers.yml:/app/receivers.yml:ro
    restart: unless-stopped

volumes:
  rxcompare-data:
